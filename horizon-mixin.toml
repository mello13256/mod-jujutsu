# Jujutsu Horizon (antes "Sukuna"): Sukuna e Gojo. Um mod nativo do tipo "trait mod" (docs/native-mods.md, "Trait mods").
# Para compilar e jogar:
#   horizon-launcher native-build <esta pasta> --trust-native-code
[mod]
id = "sukuna"
version = "0.30.3"

# O mod é escrito e checado no Nightly de 13/11/2026 (tag nightly-source/2026-11-13-9f42064),
# e o launcher 0.2.69 só sabe montar o código dos Nightlies dessa época: os mais novos (o de
# 22/11, por exemplo) mudaram as pastas do Horizon. Com o pin, quem instalou um Nightly mais novo compila
# mesmo assim, neste commit.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[api]
path = "api"
